<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Engine Internals</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0f172a;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      #wrap {
        width: 1920px;
        height: 1080px;
        transform-origin: top center;
        position: relative;
      }

      canvas {
        display: block;
      }

      #bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 16px 24px;
        z-index: 200;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .b {
        padding: 14px 44px;
        border: none;
        border-radius: 12px;
        font:
          600 19px/1 "Inter",
          "Segoe UI",
          sans-serif;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
      }

      .b:active {
        transform: scale(0.95);
      }

      #prev {
        background: rgba(255, 255, 255, 0.08);
        color: #94a3b8;
      }

      #prev:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #e2e8f0;
      }

      #next {
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        color: #fff;
        box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
      }

      #next:hover {
        box-shadow: 0 4px 28px rgba(59, 130, 246, 0.5);
      }

      #info {
        font:
          600 18px/1.4 "Inter",
          "Segoe UI",
          sans-serif;
        color: #94a3b8;
        min-width: 380px;
        text-align: center;
        padding: 8px 20px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      #info .n {
        color: #60a5fa;
        font-weight: 700;
      }

      #info .t {
        color: #e2e8f0;
      }

      .keys {
        font:
          400 15px "Inter",
          "Segoe UI",
          sans-serif;
        color: #475569;
      }
    </style>
  </head>

  <body>
    <div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
    <div id="bar">
      <button class="b" id="prev">◀ Back</button>
      <div id="info">
        <span class="n">1</span> / 20 — <span class="t">Ready</span>
      </div>
      <button class="b" id="next">Next ▶</button>
      <div class="keys">← → arrow keys &nbsp;|&nbsp; spacebar</div>
    </div>
    <script>
      const cv = document.getElementById("c"),
        X = cv.getContext("2d"),
        W = 1920,
        H = 1080;
      function fit() {
        const s = Math.min(
          window.innerWidth / W,
          (window.innerHeight - 70) / H,
          1,
        );
        document.getElementById("wrap").style.transform = `scale(${s})`;
      }
      fit();
      window.addEventListener("resize", fit);

      /* ═══ COLORS ═══ */
      const P = {
        bg: "#0f172a",
        bg2: "#1e293b",
        bg3: "#334155",
        tx: "#f1f5f9",
        tx2: "#cbd5e1",
        tx3: "#94a3b8",
        tx4: "#64748b",
        blue: "#3b82f6",
        blueD: "#1d4ed8",
        blueL: "#93c5fd",
        blueBg: "rgba(59,130,246,.08)",
        purple: "#8b5cf6",
        purpleD: "#6d28d9",
        purpleL: "#c4b5fd",
        purpleBg: "rgba(139,92,246,.08)",
        green: "#10b981",
        greenD: "#059669",
        greenL: "#6ee7b7",
        greenBg: "rgba(16,185,129,.08)",
        orange: "#f97316",
        orangeD: "#ea580c",
        orangeL: "#fdba74",
        orangeBg: "rgba(249,115,22,.08)",
        red: "#ef4444",
        redD: "#dc2626",
        redL: "#fca5a5",
        redBg: "rgba(239,68,68,.08)",
        cyan: "#06b6d4",
        cyanD: "#0891b2",
        cyanL: "#67e8f9",
        cyanBg: "rgba(6,182,212,.08)",
        amber: "#f59e0b",
        amberL: "#fcd34d",
        pink: "#ec4899",
        pinkL: "#f9a8d4",
        border: "rgba(255,255,255,.06)",
        borderL: "rgba(255,255,255,.12)",
        glow: "rgba(59,130,246,.15)",
      };

      /* ═══ EASING ═══ */
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const eOut = (t) => 1 - Math.pow(1 - t, 3);
      const eBack = (t) => {
        const c = 1.70158;
        return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
      };
      const eElastic = (t) => {
        if (!t || t === 1) return t;
        return (
          Math.pow(2, -10 * t) * Math.sin(((t * 10 - 0.75) * 2 * Math.PI) / 3) +
          1
        );
      };
      const lerp = (a, b, t) => a + (b - a) * t;
      const pulse = () => 0.5 + 0.5 * Math.sin(performance.now() * 0.003);
      const now = () => performance.now();

      /* ═══ STEPS ═══ */
      const STEPS = [
        { id: 0, label: "Title — How JS Executes Code" },
        { id: 1, label: "Show Source Code" },
        { id: 2, label: "Global Creation Phase Begins" },
        { id: 3, label: "Register Declarations" },
        { id: 4, label: "Store Function in Memory" },
        { id: 5, label: "Global Creation Complete" },
        { id: 6, label: "Execution Phase Begins" },
        { id: 7, label: 'Assign name = "Alice"' },
        { id: 8, label: "Assign age = 25" },
        { id: 9, label: "Call greet() — New Context" },
        { id: 10, label: "greet() Creation Phase" },
        { id: 11, label: 'greet() Execution — Lookup "name"' },
        { id: 12, label: "Scope Chain: greet → Global" },
        { id: 13, label: 'Resolve name = "Alice"' },
        { id: 14, label: "Initialize greeting" },
        { id: 15, label: "console.log() output" },
        { id: 16, label: "greet() returns — Pop Context" },
        { id: 17, label: "Assign result" },
        { id: 18, label: "console.log(result)" },
        { id: 19, label: "Summary & Key Concepts" },
      ];
      let step = 0,
        anim = 0;
      const AD = 600;

      function setStep(s) {
        s = clamp(s, 0, STEPS.length - 1);
        if (s === step) return;
        step = s;
        anim = 0;
        document.getElementById("info").innerHTML =
          `<span class="n">${step + 1}</span> / ${STEPS.length} — <span class="t">${STEPS[step].label}</span>`;
      }
      document.getElementById("next").onclick = () => setStep(step + 1);
      document.getElementById("prev").onclick = () => setStep(step - 1);
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " ") {
          e.preventDefault();
          setStep(step + 1);
        }
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          setStep(step - 1);
        }
      });
      setStep(0);

      /* ═══ DRAW UTILS ═══ */
      function rr(x, y, w, h, r = 12) {
        X.beginPath();
        X.moveTo(x + r, y);
        X.lineTo(x + w - r, y);
        X.quadraticCurveTo(x + w, y, x + w, y + r);
        X.lineTo(x + w, y + h - r);
        X.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        X.lineTo(x + r, y + h);
        X.quadraticCurveTo(x, y + h, x, y + h - r);
        X.lineTo(x, y + r);
        X.quadraticCurveTo(x, y, x + r, y);
        X.closePath();
      }
      function fillRR(x, y, w, h, r, col) {
        X.fillStyle = col;
        rr(x, y, w, h, r);
        X.fill();
      }
      function strokeRR(x, y, w, h, r, col, lw = 1) {
        X.strokeStyle = col;
        X.lineWidth = lw;
        rr(x, y, w, h, r);
        X.stroke();
      }

      function panel(x, y, w, h, title, titleCol, icon) {
        X.save();
        // panel bg
        const grad = X.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, "rgba(30,41,59,.92)");
        grad.addColorStop(1, "rgba(15,23,42,.96)");
        X.fillStyle = grad;
        rr(x, y, w, h, 16);
        X.fill();
        strokeRR(x, y, w, h, 16, P.border, 1);
        // header
        fillRR(x, y, w, 44, 16, P.bg2);
        X.fillRect(x, y + 32, w, 12);
        strokeRR(x, y, w, 44, 16, "rgba(255,255,255,.04)", 1);
        // header line
        X.strokeStyle = P.border;
        X.lineWidth = 1;
        X.beginPath();
        X.moveTo(x, y + 44);
        X.lineTo(x + w, y + 44);
        X.stroke();
        // title
        X.font = '700 18px "Inter","Segoe UI",sans-serif';
        X.textAlign = "left";
        X.fillStyle = titleCol;
        X.fillText((icon || "") + " " + title, x + 16, y + 28);
        X.restore();
      }

      function dashedLine(fx, fy, tx, ty, col, a, lw = 2) {
        X.save();
        X.globalAlpha = a;
        X.strokeStyle = col;
        X.lineWidth = lw;
        X.setLineDash([8, 6]);
        X.lineDashOffset = -now() * 0.04;
        X.beginPath();
        X.moveTo(fx, fy);
        X.lineTo(tx, ty);
        X.stroke();
        X.setLineDash([]);
        X.restore();
      }

      function arrowHead(tx, ty, angle, col, a, size = 10) {
        X.save();
        X.globalAlpha = a;
        X.fillStyle = col;
        X.beginPath();
        X.moveTo(tx, ty);
        X.lineTo(
          tx - size * Math.cos(angle - Math.PI / 6),
          ty - size * Math.sin(angle - Math.PI / 6),
        );
        X.lineTo(
          tx - size * Math.cos(angle + Math.PI / 6),
          ty - size * Math.sin(angle + Math.PI / 6),
        );
        X.closePath();
        X.fill();
        X.restore();
      }

      function dashedArrow(fx, fy, tx, ty, col, a, lw = 2) {
        dashedLine(fx, fy, tx, ty, col, a, lw);
        const an = Math.atan2(ty - fy, tx - fx);
        arrowHead(tx, ty, an, col, a, 12);
      }

      function glowBox(x, y, w, h, col, intensity = 0.5) {
        X.save();
        X.shadowColor = col;
        X.shadowBlur = 20 * intensity;
        X.fillStyle = col + "08";
        rr(x - 2, y - 2, w + 4, h + 4, 14);
        X.fill();
        X.restore();
      }

      function badge(x, y, txt, bg, fg, a) {
        X.save();
        X.globalAlpha = a;
        X.font = '700 15px "Inter",sans-serif';
        const tw = X.measureText(txt).width + 16;
        fillRR(x, y - 10, tw, 20, 5, bg);
        X.fillStyle = fg;
        X.textAlign = "left";
        X.fillText(txt, x + 8, y + 4);
        X.restore();
      }

      function phaseBadge(x, y, text, col, a) {
        X.save();
        X.globalAlpha = a;
        X.font = '800 15px "Inter",sans-serif';
        const tw = X.measureText(text).width + 20;
        fillRR(x, y - 12, tw, 24, 6, col);
        X.fillStyle = "#fff";
        X.textAlign = "left";
        X.fillText(text, x + 10, y + 3);
        X.restore();
      }

      /* ═══ SOURCE CODE PANEL ═══ */
      const CODE_LINES = [
        'let name = "Alice";',
        "let age = 25;",
        "",
        "function greet(prefix) {",
        "  let greeting = prefix + name;",
        "  return greeting;",
        "}",
        "",
        'let result = greet("Hello, ");',
        "console.log(result);",
      ];

      function drawCode(a) {
        const cx = 40,
          cy = 90,
          cw = 520,
          ch = 580;
        X.save();
        X.globalAlpha = a;
        panel(cx, cy, cw, ch, "SOURCE CODE", P.blueL, "");

        // dots
        ["#ef4444", "#f59e0b", "#22c55e"].forEach((c, i) => {
          X.fillStyle = c;
          X.beginPath();
          X.arc(cx + cw - 60 + i * 18, cy + 22, 5, 0, Math.PI * 2);
          X.fill();
        });

        const mono =
          '500 19px "SF Mono","Fira Code","Cascadia Code",Consolas,monospace';
        const monoB =
          '700 19px "SF Mono","Fira Code","Cascadia Code",Consolas,monospace';

        // syntax colors
        const kw = P.purple,
          fn = P.blue,
          str = "#22d3ee",
          nm = P.orangeL,
          op = P.tx3,
          cm = P.tx4,
          vr = P.blueL;

        const tokens = [
          [
            { t: "let ", c: kw },
            { t: "name", c: nm },
            { t: " = ", c: op },
            { t: '"Alice"', c: str },
            { t: ";", c: op },
          ],
          [
            { t: "let ", c: kw },
            { t: "age", c: nm },
            { t: " = ", c: op },
            { t: "25", c: P.amberL },
            { t: ";", c: op },
          ],
          [],
          [
            { t: "function ", c: kw },
            { t: "greet", c: fn },
            { t: "(", c: op },
            { t: "prefix", c: nm },
            { t: ") {", c: op },
          ],
          [
            { t: "  let ", c: kw },
            { t: "greeting", c: nm },
            { t: " = ", c: op },
            { t: "prefix", c: nm },
            { t: " + ", c: op },
            { t: "name", c: nm },
            { t: ";", c: op },
          ],
          [
            { t: "  return ", c: kw },
            { t: "greeting", c: nm },
            { t: ";", c: op },
          ],
          [{ t: "}", c: op }],
          [],
          [
            { t: "let ", c: kw },
            { t: "result", c: nm },
            { t: " = ", c: op },
            { t: "greet", c: fn },
            { t: "(", c: op },
            { t: '"Hello, "', c: str },
            { t: ");", c: op },
          ],
          [
            { t: "console", c: vr },
            { t: ".", c: op },
            { t: "log", c: fn },
            { t: "(", c: op },
            { t: "result", c: nm },
            { t: ");", c: op },
          ],
        ];

        X.font = mono;
        X.textAlign = "left";
        tokens.forEach((toks, i) => {
          const ly = cy + 70 + i * 44;
          // line number
          X.fillStyle = P.tx4;
          X.font = '400 16px "SF Mono",Consolas,monospace';
          X.fillText(String(i + 1).padStart(2, " "), cx + 14, ly + 8);
          X.font = mono;
          let tx2 = cx + 48;
          toks.forEach((tok) => {
            X.fillStyle = tok.c;
            X.fillText(tok.t, tx2, ly + 8);
            tx2 += X.measureText(tok.t).width;
          });
        });

        // line highlights
        const hls = [];
        if (step === 3) {
          hls.push({ l: 0, c: P.purple }, { l: 1, c: P.purple });
        }
        if (step === 4) {
          hls.push(
            { l: 3, c: P.blue },
            { l: 4, c: P.blue },
            { l: 5, c: P.blue },
            { l: 6, c: P.blue },
          );
        }
        if (step === 7) {
          hls.push({ l: 0, c: P.green });
        }
        if (step === 8) {
          hls.push({ l: 1, c: P.green });
        }
        if (step === 9 || step === 10) {
          hls.push({ l: 8, c: P.orange });
        }
        if (step === 11 || step === 12 || step === 13) {
          hls.push({ l: 4, c: P.cyan });
        }
        if (step === 14) {
          hls.push({ l: 4, c: P.green });
        }
        if (step === 15) {
          hls.push({ l: 5, c: P.green });
        }
        if (step === 16) {
          hls.push({ l: 6, c: P.red });
        }
        if (step === 17) {
          hls.push({ l: 8, c: P.green });
        }
        if (step === 18) {
          hls.push({ l: 9, c: P.green });
        }

        hls.forEach((h) => {
          const ly = cy + 70 + h.l * 38;
          X.save();
          X.globalAlpha = 0.1 + 0.05 * pulse();
          X.fillStyle = h.c;
          rr(cx + 6, ly - 15, cw - 12, 40, 6);
          X.fill();
          X.restore();
          X.save();
          X.globalAlpha = 0.5;
          X.strokeStyle = h.c;
          X.lineWidth = 1;
          rr(cx + 6, ly - 15, cw - 12, 40, 6);
          X.stroke();
          X.restore();
          // left accent
          X.save();
          X.globalAlpha = 0.8;
          X.fillStyle = h.c;
          X.fillRect(cx + 6, ly - 15, 3, 40);
          X.restore();
        });

        // phase badge on code panel
        if (step >= 2 && step <= 5) {
          const phaseA = step === 2 ? eOut(anim) : 1;
          phaseBadge(
            cx + cw - 180,
            cy + ch - 30,
            "CREATION PHASE",
            P.purpleD,
            phaseA,
          );
        }
        if (step >= 6 && step <= 18) {
          const phaseA = step === 6 ? eOut(anim) : 1;
          phaseBadge(
            cx + cw - 190,
            cy + ch - 30,
            "EXECUTION PHASE",
            P.greenD,
            phaseA,
          );
        }

        // execution pointer
        const execLines = {
          7: 0,
          8: 1,
          9: 8,
          10: 8,
          11: 4,
          14: 4,
          15: 5,
          16: 6,
          17: 8,
          18: 9,
        };
        if (execLines[step] !== undefined) {
          const el = execLines[step];
          const py = cy + 70 + el * 38;
          X.save();
          X.globalAlpha = 0.9;
          X.fillStyle = P.green;
          X.font = '19px "Inter"';
          X.textAlign = "right";
          X.fillText("▶", cx + 44, py + 8);
          X.restore();
        }

        X.restore();
      }

      /* ═══ MEMORY PANEL ═══ */
      function drawMemory(a) {
        const mx = 580,
          my = 90,
          mw = 440,
          mh = 580;
        X.save();
        X.globalAlpha = a;
        panel(mx, my, mw, mh, "ENVIRONMENTS / MEMORY", P.greenL, "");

        const entries = [];
        // Build memory state based on step
        if (step >= 3) {
          entries.push({
            k: "name",
            v: step >= 7 ? '"Alice"' : "<uninitialized>",
            t: step >= 7 ? "string" : "tdz",
            hl: step === 3 || step === 7,
          });
        }
        if (step >= 3) {
          entries.push({
            k: "age",
            v: step >= 8 ? "25" : "<uninitialized>",
            t: step >= 8 ? "number" : "tdz",
            hl: step === 3 || step === 8,
          });
        }
        if (step >= 4) {
          entries.push({
            k: "greet",
            v: "ƒ greet(prefix)",
            t: "function",
            hl: step === 4,
            isFunc: true,
          });
        }
        if (step >= 10) {
          entries.push({
            k: "prefix",
            v: '"Hello, "',
            t: "string",
            scope: "greet",
            hl: step === 10,
          });
        }
        if (step >= 10) {
          entries.push({
            k: "greeting",
            v: step >= 14 ? '"Hello, Alice"' : "<uninitialized>",
            t: step >= 14 ? "string" : "tdz",
            scope: "greet",
            hl: step === 10 || step === 14,
          });
        }
        if (step >= 3) {
          entries.push({
            k: "result",
            v: step >= 17 ? '"Hello, Alice"' : "<uninitialized>",
            t: step >= 17 ? "string" : "tdz",
            hl: step === 3 || step === 17,
          });
        }

        const startY = my + 60;
        entries.forEach((e, i) => {
          const ey = startY + i * 76;
          const ea = e.hl ? eBack(clamp(anim)) : 1;
          X.save();
          X.globalAlpha = a * ea;

          if (e.hl)
            glowBox(
              mx + 14,
              ey,
              mw - 28,
              64,
              e.isFunc ? P.blue : P.green,
              0.6 + 0.3 * pulse(),
            );

          // row bg
          const rowBg = e.isFunc ? P.blueBg : e.scope ? P.orangeBg : P.greenBg;
          fillRR(mx + 14, ey, mw - 28, 64, 10, rowBg);
          strokeRR(
            mx + 14,
            ey,
            mw - 28,
            56,
            10,
            e.hl ? (e.isFunc ? P.blue : P.green) : P.border,
            e.hl ? 1.5 : 1,
          );

          // scope tag
          if (e.scope) {
            badge(mx + mw - 110, ey + 10, "greet()", P.orangeBg, P.orangeL, a);
          }

          // key
          X.font = '700 19px "SF Mono",Consolas,monospace';
          X.textAlign = "left";
          X.fillStyle = e.isFunc ? P.blueL : P.greenL;
          X.fillText(e.k, mx + 28, ey + 27);

          // value
          X.font = '500 18px "SF Mono",Consolas,monospace';
          if (e.v === "undefined" || e.v === "<uninitialized>") {
            X.fillStyle = P.tx4;
          } else if (e.isFunc) {
            X.fillStyle = P.blueL;
          } else if (e.t === "string") {
            X.fillStyle = "#22d3ee";
          } else if (e.t === "number") {
            X.fillStyle = P.amberL;
          } else {
            X.fillStyle = P.tx2;
          }
          X.fillText(e.v, mx + 28, ey + 51);

          // type badge
          X.font = '600 14px "Inter",sans-serif';
          const typeCol =
            e.t === "function"
              ? P.blue
              : e.t === "string"
                ? P.cyan
                : e.t === "number"
                  ? P.amber
                  : e.t === "tdz"
                    ? P.red
                    : P.tx4;
          const typeTxt = e.t.toUpperCase();
          const tw = X.measureText(typeTxt).width + 12;
          fillRR(mx + mw - 36 - tw, ey + 38, tw, 22, 4, typeCol + "20");
          X.fillStyle = typeCol;
          X.fillText(typeTxt, mx + mw - 30 - tw, ey + 54);

          X.restore();
        });

        // creation-phase explanation
        if (step === 3) {
          const ea2 = eOut(anim);
          X.save();
          X.globalAlpha = ea2;

          stack.push({

        const stackBase = sy + sh - 30;

      /* ═══ MAIN RENDER ═══ */
      function render() {
        X.clearRect(0, 0, W, H);
        X.fillStyle = P.bg;
        X.fillRect(0, 0, W, H);

        // subtle grid
        X.save();
        X.globalAlpha = 0.03;
        X.strokeStyle = "#fff";
        X.lineWidth = 1;
        for (let gx = 0; gx < W; gx += 60) {
          X.beginPath();
          X.moveTo(gx, 0);
          X.lineTo(gx, H);
          X.stroke();
        }
        for (let gy = 0; gy < H; gy += 60) {
          X.beginPath();
          X.moveTo(0, gy);
          X.lineTo(W, gy);
          X.stroke();
        }
        X.restore();

        const a = clamp(anim);

        if (step === 0) {
          drawTitle(eOut(a));
          return;
        }
        if (step === 19) {
          drawHeader();
          drawSummary(eOut(a));
          return;
        }

        drawHeader();

        // panels
        if (step >= 1) {
          const pa = step === 1 ? eOut(a) : 1;
          drawCode(pa);
        }
        if (step >= 2) {
          const ma = step === 2 ? eOut(a) : 1;
          drawMemory(ma);
        }
        if (step >= 2) {
          const sa = step === 2 ? eOut(a) : 1;
          drawCallStack(sa);
        }
        if (step >= 2) {
          const ca = step === 2 ? eOut(a) : 1;
          drawConsole(ca);
        }

        drawScopeChain(step === 12 ? eOut(a) : step === 13 ? 1 : 0);
        drawConnections(eOut(a));
        drawNarration(step >= 1 ? 1 : 0);
      }

      let lastT = 0;
      function loop(ts) {
        const dt = (ts - lastT) / 1000;
        lastT = ts;
        anim = clamp(anim + dt * (1000 / AD));
        render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
